# Per-task model configuration.
#
# The provider endpoint and API key come from `.env` (LLM_BASE_URL / LLM_API_KEY).
# Only the *model chain* lives here, so you can point the whole app at Groq or at
# a local Ollama daemon without touching this file. Each task is tried in order:
# `models[0]` first, then each fallback, with retry/backoff between attempts.
#
# Groq reference models (set LLM_PROVIDER=groq to use these):
#   primary   openai/gpt-oss-120b
#   fallback  qwen/qwen3-32b
# Ollama reference models (LLM_PROVIDER=ollama, the offline default):
#   primary   llama3.2:latest
#   fallback  llama3:latest

defaults:
  temperature: 0
  # Wall-clock budget for one completion. Local models on CPU need headroom.
  timeout_seconds: 180
  # Attempts per model before moving to the next model in the chain.
  max_attempts_per_model: 3
  retry_backoff_seconds: 2
  retry_backoff_max_seconds: 30

tasks:
  # Turns cleaned postmortem prose into the Incident schema.
  extraction:
    models:
      - llama3.2:latest
      - llama3:latest
    max_tokens: 4096
    # Extraction is a structured-reasoning task: give it the most room.
    timeout_seconds: 300

  # Turns a unified diff into structured change facts (no verdict).
  diff_understanding:
    models:
      - llama3.2:latest
      - llama3:latest
    max_tokens: 2048

  # Produces the RiskVerdict by reasoning over recalled evidence.
  verdict:
    models:
      - llama3.2:latest
      - llama3:latest
    max_tokens: 3072
    timeout_seconds: 300

  # Writes a realistic PR diff that introduces a given failure precursor.
  benchmark_generation:
    models:
      - llama3.2:latest
      - llama3:latest
    max_tokens: 2048

  # Condition A of the evaluation: a verdict from the diff alone, no memory.
  verdict_no_memory:
    models:
      - llama3.2:latest
      - llama3:latest
    max_tokens: 1536
